name: Deploy THOTH AI to Vercel (production)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Vercel (production)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          URL=$(npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $URL"

      - name: Health check (production domain)
        run: |
          # NOTE: *.vercel.app deployment URLs are SSO-protected (302) on this plan;
          # the custom production domain is not. Check the real user-facing URL.
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" "https://thothai.site/api/health" || true)
            if [ "$CODE" = "200" ] && grep -q '"status":"ok"' /tmp/health.json; then
              echo "Production health check passed (200, status=ok)"; cat /tmp/health.json; exit 0
            fi
            echo "Attempt $i -> $CODE, retrying in 10s..."; sleep 10
          done
          echo "::error::Production health check failed"; cat /tmp/health.json 2>/dev/null; exit 1
